# Builds the site from the latest a3ref/data and deploys it to GitHub Pages.
# Runs on every push here, and daily an hour after the data sync, deploying only if the data changed.
name: Deploy site

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - id: compare
        run: |
          latest=$(git ls-remote https://github.com/a3ref/data.git refs/heads/main | cut -f1)
          live=$(curl -fsSL https://a3ref.github.io/data-version.txt || true)
          echo "data: $latest, live site: ${live:-none}"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$latest" != "$live" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: a3ref/data
          path: data
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m biwiki build
      - run: git -C data rev-parse HEAD > out/data-version.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v5
